<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<title>Painel</title>
<style>
:root{--plano:#0d0d0d;--sup:#1a1a19;--sup2:#232321;--tinta:#f0efec;--tinta2:#c3c2b7;--mudo:#898781;--grade:#2c2c2a;--eixo:#383835;--serie:#3987e5;--sobe:#0ca30c;--desce:#e66767;--aviso:#fab219}
@media (prefers-color-scheme: light){:root{--plano:#f9f9f7;--sup:#fcfcfb;--sup2:#f0efec;--tinta:#0b0b0b;--tinta2:#52514e;--mudo:#898781;--grade:#e1e0d9;--eixo:#c3c2b7;--serie:#2a78d6;--sobe:#006300;--desce:#d03b3b;--aviso:#8a5a00}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--plano);color:var(--tinta);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:inherit}
button,select,input{font:inherit;color:inherit}
.env{max-width:1080px;margin:0 auto;padding:0 14px 60px}
/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
#login form{width:100%;max-width:340px;background:var(--sup);border:1px solid var(--grade);border-radius:14px;padding:26px 22px}
#login h1{font-size:19px;margin:0 0 4px}
#login p{margin:0 0 18px;color:var(--tinta2);font-size:13.5px}
#login input[type=password]{width:100%;padding:12px;border-radius:9px;border:1px solid var(--eixo);background:var(--plano);font-size:16px}
#login label.l{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13.5px;color:var(--tinta2)}
#login button{width:100%;padding:12px;border:0;border-radius:9px;background:var(--serie);color:#fff;font-weight:600;cursor:pointer}
#erro{color:var(--desce);font-size:13.5px;min-height:20px;margin-top:10px}
/* topo */
header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:16px 0 8px;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header small{color:var(--mudo)}
header button{background:none;border:0;color:var(--mudo);text-decoration:underline;cursor:pointer;padding:0;font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 0 12px;position:sticky;top:0;background:var(--plano);z-index:5;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--eixo);background:none;cursor:pointer;color:var(--tinta2);font-size:14px}
.chip[aria-pressed=true]{background:var(--tinta);color:var(--plano);border-color:var(--tinta);font-weight:600}
h2{font-size:15px;margin:26px 0 10px;color:var(--tinta)}
h2 small{font-weight:400;color:var(--mudo);margin-left:6px}
.cartao{background:var(--sup);border:1px solid var(--grade);border-radius:12px;padding:14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile .r{color:var(--tinta2);font-size:12.5px}
.tile .n{font-size:25px;font-weight:650;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums}
.tile .d{font-size:12.5px;color:var(--mudo);margin-top:2px}
.sobe{color:var(--sobe)}.desce{color:var(--desce)}
.cab{display:flex;align-items:center;gap:12px;margin:8px 0 14px}
.cab img{width:46px;height:46px;border-radius:50%;background:var(--sup2)}
.cab b{font-size:17px}.cab span{display:block;color:var(--mudo);font-size:13px}
.cab a{margin-left:auto;font-size:13px;color:var(--tinta2);white-space:nowrap}
.lista{display:flex;flex-direction:column}
.lin{display:flex;gap:11px;align-items:center;padding:10px 0;border-top:1px solid var(--grade);text-decoration:none}
.lin:first-child{border-top:0}
.lin img{width:88px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;background:var(--sup2);flex:none}
.lin .t{flex:1;min-width:0}
.lin .t b{display:block;font-weight:550;font-size:14px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.lin .t span{color:var(--mudo);font-size:12.5px}
.lin .v{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;white-space:nowrap}
.lin .v small{display:block;color:var(--mudo);font-size:12px}
.selo{display:inline-block;font-size:11px;padding:1px 6px;border-radius:5px;border:1px solid var(--eixo);color:var(--tinta2);margin-right:5px}
.quando{flex:none;width:74px;font-size:12.5px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.quando b{display:block;color:var(--tinta);font-size:14px}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.filtros .chip{padding:5px 11px;font-size:13px}
.vazio{color:var(--mudo);font-size:13.5px;padding:6px 0}
.graf{position:relative}
.graf svg{display:block;width:100%;height:auto;touch-action:pan-y}
.graf text{font-size:11px;fill:var(--mudo);font-variant-numeric:tabular-nums}
.dica{position:absolute;pointer-events:none;background:var(--sup2);border:1px solid var(--eixo);border-radius:7px;padding:5px 8px;font-size:12.5px;white-space:nowrap;transform:translate(-50%,-115%);display:none;z-index:3}
.dica b{font-variant-numeric:tabular-nums}
.duo{display:grid;gap:10px}
@media(min-width:720px){.duo{grid-template-columns:1fr 1fr}}
.gt{font-size:13px;color:var(--tinta2);margin:0 0 6px}
details{margin-top:8px;font-size:13px;color:var(--tinta2)}
details table{border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
details td,details th{padding:2px 12px 2px 0;text-align:right;font-weight:400}
details th{color:var(--mudo)}
table.comp{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.comp th{font-size:12px;color:var(--mudo);font-weight:400;text-align:right;padding:0 0 6px 8px}
table.comp td{padding:9px 0 9px 8px;border-top:1px solid var(--grade);text-align:right;font-size:14px}
table.comp th:first-child,table.comp td:first-child{text-align:left;padding-left:0}
table.comp tr{cursor:pointer}
table.comp small{display:block;font-size:11.5px;color:var(--mudo)}
.mais{margin-top:10px;width:100%;padding:9px;border-radius:9px;border:1px solid var(--eixo);background:none;cursor:pointer;color:var(--tinta2)}
.alerta{border-color:var(--aviso);color:var(--tinta2);font-size:13.5px}
</style>
</head>
<body>
<div id="login"><form id="f" autocomplete="off">
  <h1>Painel</h1><p>Acesso restrito.</p>
  <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" autofocus>
  <label class="l"><input type="checkbox" id="lembrar"> Lembrar neste aparelho</label>
  <button>Entrar</button><div id="erro" role="alert"></div>
</form></div>
<div id="app" class="env" hidden></div>

  const m=await crypto.subtle.importKey("raw",new TextEncoder().encode(senha),"PBKDF2",false,["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt:b64(C.sal),iterations:C.rodadas},m,256));
}
async function abrir(raw){
  const k=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  const p=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(C.nonce)},k,b64(C.cifra));
  return JSON.parse(new TextDecoder().decode(p));
}
const guardado=()=>{try{return localStorage.getItem(CH)}catch(e){return null}};
const E=id=>document.getElementById(id);
E("f").addEventListener("submit",async ev=>{
  ev.preventDefault();E("erro").textContent="";const bt=ev.target.querySelector("button");bt.disabled=true;bt.textContent="Abrindo…";
  try{const raw=await derivar(E("senha").value);const d=await abrir(raw);
    if(E("lembrar").checked){try{localStorage.setItem(CH,btoa(String.fromCharCode(...raw)))}catch(e){}}
    iniciar(d);
  }catch(e){E("erro").textContent="Senha incorreta.";bt.disabled=false;bt.textContent="Entrar"}
});
(async()=>{const g=guardado();if(g){try{iniciar(await abrir(b64(g)))}catch(e){try{localStorage.removeItem(CH)}catch(_){}}}})();

/* ---------- painel ---------- */
let D,aba="geral",faixa=30,ordem="data",tipo="todos",limite=30;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf=new Intl.NumberFormat("pt-BR");
const N=n=>nf.format(n);
const curto=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(".",",")+" mi":n>=1e4?Math.round(n/1e3)+" mil":N(n);
const TZ="Europe/Lisbon";
const dia=d=>new Date(d).toLocaleDateString("pt-BR",{timeZone:TZ,day:"2-digit",month:"2-digit"});
const diaAno=d=>new Date(d).toLocaleDateString("pt-BR",{timeZone:TZ,day:"2-digit",month:"2-digit",year:"2-digit"});
const sem=d=>new Date(d).toLocaleDateString("pt-BR",{timeZone:TZ,weekday:"short"}).replace(".","");
const hora=d=>new Date(d).toLocaleTimeString("pt-BR",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
const dur=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(x).padStart(2,"0")};
const nome=c=>c.sigla||c.nome;
const pc=x=>x.toFixed(1).replace(".",",")+"%";
function baixar(id){const R=D.relatorios||{};const txt=id=="todos"?D.canais.map(c=>R[c.id]||"").join("\n\n---\n\n"):R[id];if(!txt)return;
  const c=D.canais.find(c=>c.id==id),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"text/markdown"}));
  a.download=`relatorio_${id=="todos"?"todos":(c.sigla||c.nome).replace(/\W+/g,"_")}_${D.gerado.slice(0,10)}.md`;document.body.appendChild(a);a.click();a.remove()}
function serie(ch,campo){const h=(D.historico.canais||{})[ch]||{};return Object.keys(h).sort().map(d=>({d,y:h[d][campo]}))}
function delta(ch,campo,dias){const s=serie(ch,campo);if(s.length<2)return null;const fim=s[s.length-1];
  const alvo=new Date(new Date(fim.d)-dias*864e5).toISOString().slice(0,10);
  let base=null;for(const p of s){if(p.d<=alvo)base=p}if(!base)base=s[0];
  const n=Math.round((new Date(fim.d)-new Date(base.d))/864e5);return n?{v:fim.y-base.y,n}:null}
function dtxt(dl){if(!dl)return '<span>histórico começa agora</span>';const s=dl.v>0?"sobe":dl.v<0?"desce":"";
  return `<span class="${s}">${dl.v>0?"▲ +":dl.v<0?"▼ ":""}${N(dl.v)}</span> em ${dl.n} ${dl.n==1?"dia":"dias"}`}
const agendados=c=>c.videos.filter(v=>v.estado=="private"&&v.agendado).sort((a,b)=>a.agendado<b.agendado?-1:1);
const publicos=c=>c.videos.filter(v=>v.estado=="public");

function iniciar(d){D=d;E("login").remove();E("app").hidden=false;desenhar()}
function sair(){try{localStorage.removeItem(CH)}catch(e){}location.reload()}
function ir(a){aba=a;limite=30;desenhar();scrollTo(0,0)}
function desenhar(){
  const app=E("app");
  let h=`<header><h1>Painel dos canais</h1><small>Atualizado ${diaAno(D.gerado)} às ${hora(D.gerado)} (Lisboa) · <button onclick="sair()">sair</button></small></header><nav>`;
  h+=`<button class="chip" aria-pressed="${aba=="geral"}" onclick="ir('geral')">Visão geral</button>`;
  for(const c of D.canais)h+=`<button class="chip" aria-pressed="${aba==c.id}" onclick="ir('${c.id}')">${esc(nome(c))}</button>`;
  h+="</nav>";
  h+=aba=="geral"?geral():canal(D.canais.find(c=>c.id==aba));
  app.innerHTML=h;ligarGraficos();
}
function tile(r,n,d){return `<div class="cartao tile"><div class="r">${r}</div><div class="n">${n}</div>${d?`<div class="d">${d}</div>`:""}</div>`}
function linhaAg(v,c){return `<a class="lin" href="https://studio.youtube.com/video/${v.id}/edit" target="_blank" rel="noopener">
  <div class="quando"><b>${dia(v.agendado)}</b>${sem(v.agendado)} ${hora(v.agendado)}</div>
  <div class="t"><b>${esc(v.titulo)}</b><span>${c?`<span class="selo">${esc(nome(c))}</span>`:""}${v.short?"Short":"Longo"} · ${dur(v.dur)}</span></div></a>`}
function geral(){
  const tot=k=>D.canais.reduce((a,c)=>a+c[k],0);
  const ag=D.canais.flatMap(c=>agendados(c).map(v=>({v,c}))).sort((a,b)=>a.v.agendado<b.v.agendado?-1:1);
  let h="";
  if(D.erros&&D.erros.length)h+=`<div class="cartao alerta">⚠ Falha na coleta: ${D.erros.map(e=>esc(e.canal)).join(", ")}. Os números desses canais não foram atualizados.</div>`;
  h+=`<h2>Todos os canais</h2><div class="tiles">${tile("Inscritos",N(tot("inscritos")))}${tile("Views",curto(tot("views")))}${tile("Vídeos públicos",N(D.canais.reduce((a,c)=>a+publicos(c).length,0)))}${tile("Agendados",N(ag.length))}</div>`;
  h+=`<button class="mais" onclick="baixar('todos')">⬇ Baixar relatório de todos os canais (.md)</button>`;
  h+=`<h2>Por canal <small>toque para abrir</small></h2><div class="cartao"><table class="comp"><tr><th>Canal</th><th>Inscritos</th><th>Views</th><th>Agend.</th></tr>`;
  for(const c of D.canais){const di=delta(c.id,"i",7),dv=delta(c.id,"v",7);
    const s=dl=>dl?`<small>${dl.v>0?"▲ +":dl.v<0?"▼ ":""}${N(dl.v)} / ${dl.n}d</small>`:"";
    h+=`<tr onclick="ir('${c.id}')"><td><b>${esc(nome(c))}</b><small>${esc(c.sigla?c.nome:c.handle)}</small></td><td>${N(c.inscritos)}${s(di)}</td><td>${curto(c.views)}${s(dv)}</td><td>${agendados(c).length}</td></tr>`}
  h+="</table></div>";
  h+=`<h2>Inscritos por canal</h2><div class="cartao">${barrasH(D.canais.map(c=>({r:nome(c),y:c.inscritos})))}</div>`;
  h+=`<h2>Próximas publicações <small>${ag.length} agendadas</small></h2><div class="cartao lista">${ag.length?ag.slice(0,12).map(x=>linhaAg(x.v,x.c)).join(""):'<div class="vazio">Nada agendado.</div>'}</div>`;
  const en=(D.entregas||[]).filter(e=>e.pasta);
  h+=`<h2>Em andamento <small>produção pronta à espera do upload</small></h2><div class="cartao lista">${en.length?en.map(e=>`<div class="lin"><div class="t"><b>${esc(e.pasta)}</b><span>${e.arquivos} arquivos</span></div><div class="v">${e.qc?"com controle de qualidade":"sem controle de qualidade"}</div></div>`).join(""):'<div class="vazio">Nenhuma entrega na fila.</div>'}</div>`;
  return h;
}
function canal(c){
  const pub=publicos(c),ag=agendados(c),outros=c.videos.filter(v=>v.estado!="public"&&!(v.estado=="private"&&v.agendado));
  let h=`<div class="cab">${c.avatar?`<img src="${esc(c.avatar)}" alt="">`:""}<div><b>${esc(c.nome)}</b><span>${esc(c.handle)}</span></div><a href="https://studio.youtube.com/channel/${c.id}" target="_blank" rel="noopener">Abrir Studio ↗</a></div>`;
  h+=`<button class="mais" style="margin:0 0 12px" onclick="baixar('${c.id}')">⬇ Baixar relatório deste canal (.md)</button>`;
  if(!c.analytics)h+=`<div class="cartao alerta" style="margin-bottom:12px">CTR, impressões e retenção ainda não aparecem: falta reautorizar este canal com a permissão de leitura do Analytics.</div>`;
  h+=`<div class="tiles">${tile("Inscritos",N(c.inscritos),dtxt(delta(c.id,"i",7)))}${tile("Views",curto(c.views),dtxt(delta(c.id,"v",7)))}${tile("Vídeos públicos",N(pub.length),`${pub.filter(v=>!v.short).length} longos · ${pub.filter(v=>v.short).length} Shorts`)}${tile("Curtidas",N(c.likes),`${N(c.coment)} comentários`)}</div>`;
  h+=`<h2>Evolução</h2><div class="filtros">${[[7,"7 dias"],[30,"30 dias"],[90,"90 dias"],[0,"Tudo"]].map(([n,r])=>`<button class="chip" aria-pressed="${faixa==n}" onclick="faixa=${n};desenhar()">${r}</button>`).join("")}</div>`;
  const corta=s=>faixa?s.slice(-faixa-1):s;
  let si=corta(serie(c.id,"i")),sv=corta(serie(c.id,"v"));
  const an=c.analytics&&c.analytics.dias&&c.analytics.dias.length>1?c.analytics.dias:null;
  let pd=[];
  if(an){let t=c.inscritos;const ac=[];for(let i=an.length-1;i>=0;i--){ac.unshift({d:an[i].d,y:t});t-=an[i].g-an[i].p}
    si=corta(ac);pd=(faixa?an.slice(-faixa):an).map(x=>({d:x.d,y:x.v}))}
  else for(let i=1;i<sv.length;i++){const n=Math.max(1,Math.round((new Date(sv[i].d)-new Date(sv[i-1].d))/864e5));pd.push({d:sv[i].d,y:Math.round((sv[i].y-sv[i-1].y)/n)})}
  h+=`<div class="duo"><div class="cartao"><p class="gt">Inscritos</p>${linha(si)}</div><div class="cartao"><p class="gt">Views por dia</p>${barras(pd)}</div></div>`;
  h+=`<h2>Agendados <small>${ag.length}</small></h2><div class="cartao lista">${ag.length?ag.map(v=>linhaAg(v)).join(""):'<div class="vazio">Nada agendado neste canal.</div>'}</div>`;
  if(outros.length)h+=`<h2>Privados e não listados <small>${outros.length}</small></h2><div class="cartao"><details><summary>Ver lista</summary><div class="lista">${outros.map(v=>`<a class="lin" href="https://studio.youtube.com/video/${v.id}/edit" target="_blank" rel="noopener"><div class="t"><b>${esc(v.titulo)}</b><span>${v.estado=="unlisted"?"não listado":"privado"} · enviado ${diaAno(v.enviado)}</span></div></a>`).join("")}</div></details></div>`;
  let lista=pub.filter(v=>tipo=="todos"||(tipo=="shorts")==v.short);
  lista.sort((a,b)=>ordem=="views"?b.views-a.views:(a.enviado<b.enviado?1:-1));
  const fb=(k,r,sel,ac)=>`<button class="chip" aria-pressed="${sel}" onclick="${ac};limite=30;desenhar()">${r}</button>`;
  h+=`<h2>Publicados <small>${lista.length}</small></h2><div class="filtros">${fb(0,"Todos",tipo=="todos","tipo='todos'")}${fb(0,"Longos",tipo=="longos","tipo='longos'")}${fb(0,"Shorts",tipo=="shorts","tipo='shorts'")}<span style="flex:1"></span>${fb(0,"Recentes",ordem=="data","ordem='data'")}${fb(0,"Mais vistos",ordem=="views","ordem='views'")}</div>`;
  h+=`<div class="cartao lista">${lista.length?lista.slice(0,limite).map(v=>`<a class="lin" href="https://youtu.be/${v.id}" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/mqdefault.jpg" alt="" onerror="this.style.visibility='hidden'">
    <div class="t"><b>${esc(v.titulo)}</b><span>${diaAno(v.enviado)} · ${v.short?"Short":"Longo"} · ${dur(v.dur)}</span></div>
    <div class="v">${N(v.views)}<small>views</small><small>${N(v.likes)} curt. · ${N(v.coment)} com.</small>${v.ctr!=null?`<small>CTR ${pc(v.ctr)}${v.imp!=null?" · "+curto(v.imp)+" impr.":""}</small>`:""}${v.ret!=null?`<small>assistido ${pc(v.ret)}${v.ret30!=null?" · 0:30 "+pc(v.ret30):""}</small>`:""}</div></a>`).join(""):'<div class="vazio">Nenhum vídeo aqui.</div>'}
    ${lista.length>limite?`<button class="mais" onclick="limite+=30;desenhar()">Mostrar mais</button>`:""}</div>`;
  return h;
}
/* ---------- gráficos (SVG, uma série, uma cor) ---------- */
const W=520,Hh=200,M={e:8,d:44,t:10,b:22};
function escala(min,max){if(min==max){min-=1;max+=1}const bruto=(max-min)/3,p=Math.pow(10,Math.floor(Math.log10(bruto))),f=bruto/p,passo=(f<=1?1:f<=2?2:f<=5?5:10)*p;
  const a=Math.floor(min/passo)*passo,b=Math.ceil(max/passo)*passo,t=[];for(let v=a;v<=b+passo/2;v+=passo)t.push(Math.round(v*100)/100);return{a,b,t}}
function eixos(e,y){return e.t.map(v=>`<line x1="${M.e}" x2="${W-M.d}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)" stroke-width="1"/><text x="${W-M.d+6}" y="${y(v)+4}">${curto(v)}</text>`).join("")}
function rotX(s,x){if(!s.length)return"";const i=[0,s.length-1];if(s.length>4)i.splice(1,0,Math.floor((s.length-1)/2));
  return [...new Set(i)].map((k,j,a)=>`<text x="${x(k)}" y="${Hh-6}" text-anchor="${j==0?"start":j==a.length-1?"end":"middle"}">${dia(s[k].d)}</text>`).join("")}
function tabela(s,r){return `<details><summary>Ver como tabela</summary><table><tr><th>Dia</th><th>${r}</th></tr>${s.slice().reverse().map(p=>`<tr><td>${diaAno(p.d)}</td><td>${N(p.y)}</td></tr>`).join("")}</table></details>`}
function linha(s){
  if(s.length<2)return `<div class="vazio">O histórico começa agora: o gráfico aparece a partir de amanhã${s.length?` (hoje: ${N(s[0].y)})`:""}.</div>`;
  const ys=s.map(p=>p.y),e=escala(Math.min(...ys),Math.max(...ys));
  const x=i=>M.e+i*(W-M.e-M.d)/(s.length-1),y=v=>M.t+(e.b-v)*(Hh-M.t-M.b)/(e.b-e.a);
  const pts=s.map((p,i)=>`${x(i).toFixed(1)},${y(p.y).toFixed(1)}`).join(" ");
  const u=s.length-1;
  return `<div class="graf" data-t="linha" data-s='${JSON.stringify(s)}' data-a="${e.a}" data-b="${e.b}"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Inscritos ao longo do tempo">${eixos(e,y)}
  <polyline points="${pts}" fill="none" stroke="var(--serie)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="${x(u)}" cy="${y(s[u].y)}" r="4" fill="var(--serie)" stroke="var(--sup)" stroke-width="2"/>
  <g class="cur" style="display:none"><line y1="${M.t}" y2="${Hh-M.b}" stroke="var(--eixo)" stroke-width="1"/><circle r="4.5" fill="var(--serie)" stroke="var(--sup)" stroke-width="2"/></g>
  ${rotX(s,x)}</svg><div class="dica"></div></div>${tabela(s,"Inscritos")}`;
}
function barras(s){
  if(!s.length)return `<div class="vazio">O histórico começa agora: as views por dia aparecem a partir de amanhã.</div>`;
  const e=escala(0,Math.max(1,...s.map(p=>p.y)));e.a=0;
  const lw=(W-M.e-M.d)/s.length,bw=Math.max(2,Math.min(26,lw-2));
  const x=i=>M.e+i*lw+lw/2,y=v=>M.t+(e.b-v)*(Hh-M.t-M.b)/(e.b-e.a),y0=y(0);
  const bs=s.map((p,i)=>{const hgt=Math.max(0,y0-y(Math.max(0,p.y))),r=Math.min(4,bw/2,hgt);const X=x(i)-bw/2,Y=y0-hgt;
    return `<path d="M${X},${y0}V${Y+r}q0,${-r} ${r},${-r}h${bw-2*r}q${r},0 ${r},${r}V${y0}z" fill="var(--serie)"/>`}).join("");
  return `<div class="graf" data-t="barras" data-s='${JSON.stringify(s)}' data-a="0" data-b="${e.b}"><svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Views por dia">${eixos(e,y)}${bs}
  <line x1="${M.e}" x2="${W-M.d}" y1="${y0}" y2="${y0}" stroke="var(--eixo)" stroke-width="1"/>
  <g class="cur" style="display:none"><rect y="${M.t}" height="${Hh-M.t-M.b}" width="${lw}" fill="var(--tinta)" opacity=".08"/></g>
  ${rotX(s,x)}</svg><div class="dica"></div></div>${tabela(s,"Views no dia")}`;
}
function barrasH(it){
  const mx=Math.max(1,...it.map(p=>p.y));
  return `<div style="display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:13.5px">${it.map(p=>`<span>${esc(p.r)}</span><span style="height:14px;border-radius:0 4px 4px 0;background:var(--serie);width:${Math.max(.8,p.y/mx*100)}%"></span><span style="font-variant-numeric:tabular-nums">${N(p.y)}</span>`).join("")}</div>`;
}
function ligarGraficos(){
  document.querySelectorAll(".graf").forEach(g=>{
    const s=JSON.parse(g.dataset.s),a=+g.dataset.a,b=+g.dataset.b,svg=g.querySelector("svg"),cur=g.querySelector(".cur"),dc=g.querySelector(".dica"),lin=g.dataset.t=="linha";
    const y=v=>M.t+(b-v)*(Hh-M.t-M.b)/(b-a);
    const mover=ev=>{const r=svg.getBoundingClientRect(),px=((ev.touches?ev.touches[0].clientX:ev.clientX)-r.left)/r.width*W;
      let i,cx;if(lin){const st=(W-M.e-M.d)/(s.length-1);i=Math.max(0,Math.min(s.length-1,Math.round((px-M.e)/st)));cx=M.e+i*st;
        cur.querySelector("line").setAttribute("x1",cx);cur.querySelector("line").setAttribute("x2",cx);const c=cur.querySelector("circle");c.setAttribute("cx",cx);c.setAttribute("cy",y(s[i].y))}
      else{const lw=(W-M.e-M.d)/s.length;i=Math.max(0,Math.min(s.length-1,Math.floor((px-M.e)/lw)));cx=M.e+i*lw+lw/2;cur.querySelector("rect").setAttribute("x",M.e+i*lw)}
      cur.style.display="";dc.style.display="block";dc.innerHTML=`${diaAno(s[i].d)} · <b>${N(s[i].y)}</b>`;
      const fx=Math.max(60,Math.min(r.width-60,cx/W*r.width));dc.style.left=fx+"px";dc.style.top=(y(Math.max(0,s[i].y))/Hh*r.height)+"px"};
    const fora=()=>{cur.style.display="none";dc.style.display="none"};
    svg.addEventListener("mousemove",mover);svg.addEventListener("touchstart",mover,{passive:true});svg.addEventListener("touchmove",mover,{passive:true});
    svg.addEventListener("mouseleave",fora);svg.addEventListener("touchend",fora);
  });
}
</script>
